services:
  sbom-creator:
    build: .
    ports:
      - "127.0.0.1:18082:8080"
    env_file: .env
    volumes:
      - ./workspace:/workspace
      - ./secrets:/run/secrets:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    restart: "no"
    cpus: 2
    mem_limit: 2g

