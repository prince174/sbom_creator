# Benchmark-only packaging for the existing un-packaged lab-python fixture.
[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-python"
version = "0.0.0+benchmark"
dependencies = []

[tool.setuptools]
py-modules = ["app"]
package-dir = {"" = "src"}
