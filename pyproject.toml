[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sbom-creator"
version = "0.1.0"
description = "Evidence-based source and container SBOM reconciliation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "packageurl-python>=0.17,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
sbom-creator = "sbom_creator.cli:main"
sbom-creator-service = "sbom_creator.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_creator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

